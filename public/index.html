<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GYLYM • Педсовет</title><style>body{font:18px Arial;background:#f6f5ec;color:#163d2a;margin:0}header{background:#154c37;color:white;padding:25px;text-align:center}main{max-width:900px;margin:auto;padding:22px}button{background:#b89a42;color:#173c2b;border:0;border-radius:10px;padding:14px 20px;cursor:pointer;font-size:17px;margin:6px}.item{background:white;padding:16px;margin:9px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}label{display:flex;gap:12px;align-items:center}input{width:24px;height:24px}#results{display:none}.bar{height:16px;background:#b89a42;border-radius:6px}.top{border:3px solid #b89a42}small{color:#555}</style><header><h1>GYLYM MEKTEBI</h1><div id="heading">Педагогический совет • Голосование за решения</div></header><main><button onclick="lang='ru';draw()">Русский</button><button onclick="lang='kz';draw()">Қазақша</button><button onclick="location.hash='results';draw()">Экран результатов / Нәтижелер</button><section id="vote"><h2 id="prompt"></h2><div id="items"></div><button onclick="submitVote()" id="send"></button><p id="message"></p></section><section id="results"><h2 id="rtitle"></h2><p id="total"></p><div id="bars"></div><button onclick="location.hash='';draw()">Голосование / Дауыс беру</button><button onclick="print()">Печать / Басып шығару</button></section></main><script>const ru=['Организовать адресную поддержку учащихся с низкими результатами','Разработать индивидуальные маршруты для учащихся с двумя оценками «3»','Проводить работу с резервом отличников','Повысить качество обратной связи на уроках','Организовать взаимопосещение и обмен эффективными методиками','Усилить взаимодействие классных руководителей и родителей','Проводить ежемесячный анализ качества знаний','Обеспечить своевременное заполнение BilimClass','Продолжить контроль КСП, КТП и адаптированных программ','Провести мониторинг выполнения решений педсовета'];const kz=['Үлгерімі төмен оқушыларға атаулы қолдау ұйымдастыру','Екі «3» бағасы бар оқушыларға жеке оқу бағытын әзірлеу','Үздіктер резервімен жүйелі жұмыс жүргізу','Сабақтағы кері байланыстың сапасын арттыру','Өзара сабаққа қатысу және тиімді әдістермен алмасу','Сынып жетекшілері мен ата-аналардың өзара байланысын күшейту','Білім сапасына ай сайын талдау жүргізу','BilimClass журналын уақтылы толтыру','ҚМЖ, КТЖ және бейімделген бағдарламаларды бақылауды жалғастыру','Педкеңес шешімдерінің орындалуына мониторинг жүргізу'];let lang='ru';let token=localStorage.getItem('voteToken');if(!token){token=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('voteToken',token)}function draw(){const isR=location.hash==='#results';document.getElementById('vote').style.display=isR?'none':'block';document.getElementById('results').style.display=isR?'block':'none';document.getElementById('prompt').textContent=lang==='ru'?'Выберите ровно 4 решения':'Дәл 4 шешімді таңдаңыз';document.getElementById('send').textContent=lang==='ru'?'Отправить голос':'Дауыс беру';document.getElementById('rtitle').textContent=lang==='ru'?'Итоги голосования — ТОП-4':'Дауыс беру нәтижесі — ТОП-4';document.getElementById('items').innerHTML=(lang==='ru'?ru:kz).map((x,i)=>'<div class="item"><label><input type="checkbox" value="'+i+'"><span>'+(i+1)+'. '+x+'</span></label></div>').join('');if(isR)refresh()}async function submitVote(){const choices=[...document.querySelectorAll('input:checked')].map(x=>+x.value);if(choices.length!==4){alert(lang==='ru'?'Выберите ровно четыре решения':'Дәл төрт шешімді таңдаңыз');return}try{const r=await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({choices,token})});if(!r.ok)throw Error(r.status===409?'Повторное голосование запрещено':'Ошибка отправки');document.getElementById('message').textContent=lang==='ru'?'Голос принят. Спасибо!':'Дауыс қабылданды. Рақмет!';document.getElementById('send').disabled=true}catch(e){alert(e.message)}}async function refresh(){if(location.hash!=='#results')return;try{const r=await fetch('/api/results');const d=await r.json();if(!r.ok)throw Error();document.getElementById('total').textContent=(lang==='ru'?'Участников: ':'Қатысушылар: ')+d.total;const order=d.counts.map((n,i)=>({n,i})).sort((a,b)=>b.n-a.n||a.i-b.i);document.getElementById('bars').innerHTML=order.map((v,j)=>'<div class="item '+(j<4?'top':'')+'"><b>'+(j<4?'★ ':'')+(v.i+1)+'. '+(lang==='ru'?ru:kz)[v.i]+'</b><p>'+v.n+' '+(lang==='ru'?'голосов':'дауыс')+'</p><div class="bar" style="width:'+Math.max(1,100*v.n/Math.max(1,...d.counts))+'%"></div></div>').join('')}catch(e){document.getElementById('total').textContent='Ошибка загрузки / Жүктеу қатесі'}}setInterval(refresh,4000);onhashchange=draw;draw();</script></html>
